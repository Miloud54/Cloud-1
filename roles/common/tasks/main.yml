---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present

- name: Check if swap file exists
  ansible.builtin.stat:
    path: "{{ swap_file }}"
  register: swap_stat

- name: Create swap file
  ansible.builtin.command: "dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }}"
  when: not swap_stat.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: "mkswap {{ swap_file }}"
  when: not swap_stat.stat.exists

- name: Enable swap
  ansible.builtin.command: "swapon {{swap_file }}"
  when: not swap_stat.stat.exists

- name: Persist swap in fstab
  ansible.posix.mount:
    src: "{{ swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    state: present