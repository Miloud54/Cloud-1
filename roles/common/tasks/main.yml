---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present

- name: Create swap file
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ common_swap_file }} bs=1M count={{ common_swap_size_mb }}"
    creates: "{{ common_swap_file }}"
  notify:
    - Format swap file
    - Enable swap file

- name: Set swap file permissions
  ansible.builtin.file:
    path: "{{ common_swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Format and enable swap now if just created
  ansible.builtin.meta: flush_handlers

- name: Persist swap in fstab
  ansible.posix.mount:
    src: "{{ common_swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swap_swappiness }}"
    state: present
